<title>Connect with TechWorld Bangladesh</title>
<style>
:root { color-scheme: dark; --red:#DD2427; --bg:#101010; --panel:#202020; --muted:#bdbdbd; }
* { box-sizing:border-box; }
body { margin:0; min-height:100vh; padding:36px 16px; display:flex; justify-content:center; align-items:center;
  font-family:Arial,Helvetica,sans-serif; color:#fff; background:radial-gradient(ellipse at top,#292020 0%,#101010 52%,#080808 100%); }
main { width:min(100%,520px); text-align:center; }
.logo-wrap { width:150px; height:150px; margin:0 auto 18px; border-radius:22px; overflow:hidden; background:#000; }
.logo-wrap img { width:100%; height:100%; object-fit:contain; display:block; }
h1 { margin:0; font-size:clamp(27px,6vw,36px); letter-spacing:.2px; }
.kicker { color:var(--red); font-weight:800; letter-spacing:3px; font-size:13px; margin:13px 0 8px; }
.sub { color:var(--muted); margin:0 0 26px; line-height:1.55; font-size:14px; }
.links { display:grid; gap:11px; }
a.link { display:flex; align-items:center; justify-content:space-between; gap:12px; text-decoration:none; color:#fff;
  background:linear-gradient(110deg,#242424,#191919); border:1px solid #3b3b3b; border-left:4px solid var(--red);
  border-radius:13px; padding:17px 18px; font-weight:700; transition:transform .15s,border-color .15s; }
a.link:hover { transform:translateY(-2px); border-color:var(--red); }
.arrow { color:var(--red); font-size:20px; }
footer { margin-top:28px; color:#888; font-size:12px; line-height:1.6; }
@media (prefers-reduced-motion:reduce) { * { transition:none!important; } }
</style>
